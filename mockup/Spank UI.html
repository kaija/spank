document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

yle>\n  <style>:root{\n--color-accent:#5856D6;\n--color-accent-hover:#4745B5;\n--color-accent-light:rgba(88,86,214,0.08);\n--color-accent-glow:rgba(88,86,214,0.15);\n--color-text-primary:#1a1a2e;\n--color-text-secondary:#64648c;\n--color-text-tertiary:#8e8eaa;\n--color-bg:#ffffff;\n--color-bg-secondary:#f8f8fc;\n--color-bg-tertiary:#f0f0f8;\n--color-border:rgba(0,0,0,0.06);\n--color-border-strong:rgba(0,0,0,0.1);\n/* status — indigo-adjacent, same low-chroma family as the accent */\n--color-success:#1f9d6b;\n--color-success-light:rgba(31,157,107,0.08);\n--color-warning:#c07a12;\n--color-warning-light:rgba(192,122,18,0.08);\n--color-danger:#d1435b;\n--color-danger-light:rgba(209,67,91,0.08);\n--color-scrim:rgba(26,26,46,0.4);\n/* semantic aliases */\n--surface-page:var(--color-bg);\n--surface-section:var(--color-bg-secondary);\n--surface-card:var(--color-bg);\n--text-body:var(--color-text-primary);\n--text-muted:var(--color-text-secondary);\n--text-faint:var(--color-text-tertiary);\n--text-on-accent:#ffffff;\n--surface-sunken:var(--color-bg-tertiary);\n--status-info:var(--color-accent);\n}\n<\u002Fstyle>\n  <style>:root{\n--font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;\n--font-mono:'SF Mono','Fira Code','JetBrains Mono',monospace;\n/* type scale as used across the Arlo sites */\n--fs-hero:3.5rem;      /* h1, 700, ls -0.03em, lh 1.1 */\n--fs-h2:2rem;          /* section headers, 700, ls -0.02em */\n--fs-h3:1.125rem;      /* card titles, 600, ls -0.01em */\n--fs-subtitle:1.125rem;/* section/hero subtitles, 400 */\n--fs-body:1rem;        /* base body, lh 1.6 */\n--fs-small:0.875rem;   /* card body, nav links, 500 for links */\n--fs-xs:0.8125rem;     /* pills, badges, footer links */\n--fw-regular:400; /* @kind font */\n--fw-medium:500; /* @kind font */\n--fw-semibold:600; /* @kind font */\n--fw-bold:700; /* @kind font */\n--ls-hero:-0.03em;\n--ls-heading:-0.02em;\n--ls-title:-0.01em;\n--lh-tight:1.1; /* @kind font */\n--lh-body:1.6; /* @kind font */\n--lh-relaxed:1.7; /* @kind font */\n}\n<\u002Fstyle>\n  <style>:root{\n--radius-xs:5px; /* 16-20px controls: checkbox, small ticks */\n--radius-mark:7px; /* the rounded square inside every Arlo brand mark */\n--radius-sm:8px;\n--radius-md:12px;\n--radius-lg:16px;\n--radius-xl:24px;\n--radius-pill:999px;\n--shadow-sm:0 1px 2px rgba(0,0,0,0.04);\n--shadow-md:0 4px 12px rgba(0,0,0,0.06);\n--shadow-lg:0 8px 32px rgba(0,0,0,0.08);\n--shadow-xl:0 16px 48px rgba(0,0,0,0.1);\n--shadow-accent:0 4px 16px rgba(88,86,214,0.3);\n--ring-accent:0 0 0 1px var(--color-accent-glow);\n--transition-fast:150ms ease; /* @kind other */\n--transition-base:250ms ease; /* @kind other */\n}\n<\u002Fstyle>\n  <style>*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}\nhtml{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}\nbody{font-family:var(--font-sans);font-size:16px;line-height:1.6;color:var(--color-text-primary);background:var(--color-bg);overflow-x:hidden}\na{color:inherit;text-decoration:none}\nimg{max-width:100%;display:block}\n<\u002Fstyle>\n  <style>/* Application UI classes — extend the arlo-web marketing contract in css/components.css\n   to product surfaces. Same radii, same 150/250ms ease, same hairline borders. */\n\n/* forms */\n.field{display:flex;flex-direction:column;gap:7px}\n.field-label{font-size:0.8125rem;font-weight:600;color:var(--text-body);letter-spacing:-0.01em}\n.field-hint{font-size:0.75rem;color:var(--text-faint);line-height:1.5}\n.field-hint-error{color:var(--color-danger)}\n.input{width:100%;font-family:inherit;font-size:0.9375rem;color:var(--text-body);background:var(--color-bg);padding:10px 14px;border:1px solid var(--color-border-strong);border-radius:var(--radius-sm);transition:all var(--transition-fast)}\n.input::placeholder{color:var(--text-faint)}\n.input:hover{border-color:rgba(0,0,0,0.18)}\n.input:focus{outline:none;border-color:var(--color-accent);box-shadow:0 0 0 3px var(--color-accent-light)}\n.input:disabled{background:var(--color-bg-secondary);color:var(--text-faint);cursor:not-allowed}\n.input-sm{padding:7px 11px;font-size:0.8125rem}\n.input-error{border-color:var(--color-danger)}\n.input-error:focus{border-color:var(--color-danger);box-shadow:0 0 0 3px var(--color-danger-light)}\ntextarea.input{resize:vertical;min-height:88px;line-height:1.6}\n.input-wrap{position:relative;display:flex;align-items:center}\n.input-wrap .input{padding-left:40px}\n.input-icon{position:absolute;left:13px;display:flex;color:var(--text-faint);pointer-events:none}\n.input-wrap:focus-within .input-icon{color:var(--color-accent)}\n.select-wrap{position:relative;display:inline-flex;align-items:center;width:100%}\n.select{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:38px}\n.select-chevron{position:absolute;right:13px;display:flex;color:var(--text-faint);pointer-events:none}\n.check{display:inline-flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:0.875rem;color:var(--text-body);line-height:1.4}\n.check input{position:absolute;opacity:0;width:0;height:0}\n.check-box{flex:none;width:18px;height:18px;margin-top:1px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--color-bg);border:1px solid var(--color-border-strong);border-radius:var(--radius-xs);transition:all var(--transition-fast)}\n.check-box-round{border-radius:var(--radius-pill)}\n.check:hover .check-box{border-color:var(--color-accent)}\n.check input:focus-visible+.check-box{box-shadow:0 0 0 3px var(--color-accent-light);border-color:var(--color-accent)}\n.check input:checked+.check-box{background:var(--color-accent);border-color:var(--color-accent)}\n.check-dot{width:7px;height:7px;border-radius:var(--radius-pill);background:#fff;opacity:0;transition:opacity var(--transition-fast)}\n.check input:checked+.check-box .check-dot{opacity:1}\n.check-tick{opacity:0;transition:opacity var(--transition-fast)}\n.check input:checked+.check-box .check-tick{opacity:1}\n.check input:disabled+.check-box{background:var(--color-bg-tertiary);border-color:var(--color-border);opacity:0.7}\n.check-disabled{color:var(--text-faint);cursor:not-allowed}\n.switch{display:inline-flex;align-items:center;gap:12px;cursor:pointer;font-size:0.875rem;color:var(--text-body)}\n.switch input{position:absolute;opacity:0;width:0;height:0}\n.switch-track{flex:none;width:44px;height:26px;padding:3px;background:var(--color-bg-tertiary);border:1px solid var(--color-border);border-radius:var(--radius-pill);transition:all var(--transition-base)}\n.switch-knob{width:18px;height:18px;background:#fff;border-radius:var(--radius-pill);box-shadow:var(--shadow-sm),0 0 0 1px rgba(0,0,0,0.04);transition:transform var(--transition-base)}\n.switch input:checked+.switch-track{background:var(--color-accent);border-color:var(--color-accent)}\n.switch input:checked+.switch-track .switch-knob{transform:translateX(18px)}\n.switch input:focus-visible+.switch-track{box-shadow:0 0 0 3px var(--color-accent-light)}\n.switch-sm .switch-track{width:34px;height:20px;padding:2px}\n.switch-sm .switch-knob{width:14px;height:14px}\n.switch-sm input:checked+.switch-track .switch-knob{transform:translateX(14px)}\n.switch input:disabled+.switch-track{opacity:0.5}\n.slider{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:var(--radius-pill);background:var(--color-bg-tertiary);cursor:pointer}\n.slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:var(--radius-pill);background:#fff;border:1px solid var(--color-border-strong);box-shadow:var(--shadow-sm);transition:box-shadow var(--transition-fast)}\n.slider::-moz-range-thumb{width:18px;height:18px;border-radius:var(--radius-pill);background:#fff;border:1px solid var(--color-border-strong);box-shadow:var(--shadow-sm)}\n.slider:hover::-webkit-slider-thumb{box-shadow:var(--shadow-md)}\n.slider:focus{outline:none}\n.slider:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--color-accent-light)}\n.slider-row{display:flex;align-items:center;gap:16px}\n.slider-value{flex:none;min-width:44px;text-align:right;font-family:var(--font-mono);font-size:0.8125rem;color:var(--text-muted)}\n\n/* display */\n.card{background:var(--surface-card);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:32px 28px}\n.card-sm{padding:20px}\n.card-interactive{transition:all var(--transition-base);cursor:pointer}\n.card-interactive:hover{border-color:var(--color-accent-glow);box-shadow:var(--shadow-md),0 0 0 1px var(--color-accent-glow);transform:translateY(-2px)}\n.card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}\n.card-title{font-size:1.125rem;font-weight:600;letter-spacing:-0.01em}\n.card-sub{font-size:0.875rem;color:var(--text-muted);line-height:1.6}\n.card-footer{display:flex;align-items:center;gap:12px;margin-top:24px;padding-top:20px;border-top:1px solid var(--color-border)}\n.avatar{flex:none;position:relative;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;font-size:0.8125rem;font-weight:600;color:var(--color-accent);background:var(--color-accent-light);border-radius:var(--radius-pill);overflow:hidden;letter-spacing:0}\n.avatar img{width:100%;height:100%;object-fit:cover}\n.avatar-xs{width:24px;height:24px;font-size:0.625rem}\n.avatar-sm{width:28px;height:28px;font-size:0.6875rem}\n.avatar-lg{width:48px;height:48px;font-size:1rem}\n.avatar-square{border-radius:var(--radius-sm)}\n.avatar-status{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:var(--radius-pill);border:2px solid var(--color-bg);background:var(--color-success)}\n.avatar-status-away{background:var(--color-warning)}\n.avatar-status-offline{background:var(--color-text-tertiary)}\n.avatar-group{display:flex}\n.avatar-group .avatar{box-shadow:0 0 0 2px var(--color-bg);margin-left:-8px}\n.avatar-group .avatar:first-child{margin-left:0}\n.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;font-size:0.75rem;font-weight:600;line-height:1.3;border-radius:var(--radius-pill);color:var(--color-accent);background:var(--color-accent-light)}\n.badge-neutral{color:var(--text-muted);background:var(--color-bg-tertiary)}\n.badge-success{color:var(--color-success);background:var(--color-success-light)}\n.badge-warning{color:var(--color-warning);background:var(--color-warning-light)}\n.badge-danger{color:var(--color-danger);background:var(--color-danger-light)}\n.badge-solid{color:#fff;background:var(--color-accent)}\n.badge-dot{width:6px;height:6px;border-radius:var(--radius-pill);background:currentColor}\n.tag{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;font-size:0.8125rem;font-weight:500;color:var(--text-muted);background:var(--color-bg-tertiary);border:1px solid var(--color-border);border-radius:var(--radius-pill);transition:all var(--transition-fast)}\n.tag-accent{color:var(--color-accent);background:var(--color-accent-light);border-color:var(--color-accent-glow)}\n.tag-remove{display:flex;padding:0;margin-right:-3px;color:var(--text-faint);background:none;border:none;cursor:pointer;transition:color var(--transition-fast)}\n.tag-remove:hover{color:var(--text-body)}\n.tag-button{cursor:pointer;font-family:inherit}\n.tag-button:hover{border-color:var(--color-border-strong);color:var(--text-body)}\n.table-wrap{border:1px solid var(--color-border);border-radius:var(--radius-lg);overflow:hidden;background:var(--surface-card)}\n.table{width:100%;border-collapse:collapse;font-size:0.875rem}\n.table th{padding:12px 20px;text-align:left;font-size:0.75rem;font-weight:600;color:var(--text-faint);letter-spacing:0.01em;background:var(--color-bg-secondary);border-bottom:1px solid var(--color-border)}\n.table td{padding:14px 20px;color:var(--text-body);border-bottom:1px solid var(--color-border);vertical-align:middle}\n.table tbody tr:last-child td{border-bottom:none}\n.table tbody tr{transition:background var(--transition-fast)}\n.table tbody tr:hover{background:var(--color-bg-secondary)}\n.table-num{text-align:right;font-family:var(--font-mono);font-size:0.8125rem;color:var(--text-muted)}\n.progress{height:6px;background:var(--color-bg-tertiary);border-radius:var(--radius-pill);overflow:hidden}\n.progress-bar{height:100%;background:var(--color-accent);border-radius:var(--radius-pill);transition:width var(--transition-base)}\n.progress-bar-success{background:var(--color-success)}\n.progress-bar-danger{background:var(--color-danger)}\n.progress-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px;font-size:0.8125rem}\n.progress-head span:last-child{font-family:var(--font-mono);color:var(--text-muted)}\n.progress-indeterminate .progress-bar{width:35%;animation:arlo-slide 1.2s ease-in-out infinite}\n@keyframes arlo-slide{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}\n.spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--color-border-strong);border-top-color:var(--color-accent);border-radius:var(--radius-pill);animation:arlo-spin 0.7s linear infinite}\n@keyframes arlo-spin{to{transform:rotate(360deg)}}\n.spinner-sm{width:14px;height:14px;border-width:1.5px}\n.spinner-lg{width:32px;height:32px;border-width:3px}\n.spinner-on-accent{border-color:rgba(255,255,255,0.35);border-top-color:#fff}\n\n/* navigation controls */\n.tabs{display:flex;gap:32px;border-bottom:1px solid var(--color-border)}\n.tab{position:relative;padding:0 0 14px;font-family:inherit;font-size:0.9375rem;font-weight:500;color:var(--text-muted);background:none;border:none;cursor:pointer;transition:color var(--transition-fast)}\n.tab:hover{color:var(--text-body)}\n.tab[aria-selected='true']{color:var(--text-body)}\n.tab[aria-selected='true']::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--color-accent);border-radius:var(--radius-pill)}\n.tab-count{margin-left:7px;font-size:0.75rem;color:var(--text-faint)}\n.tabs-pill{display:inline-flex;align-items:center;gap:2px;padding:3px;background:var(--color-bg-tertiary);border-radius:var(--radius-pill);border:none}\n.tabs-pill .tab{padding:5px 14px;font-size:0.8125rem;border-radius:var(--radius-pill)}\n.tabs-pill .tab[aria-selected='true']{background:var(--color-bg);box-shadow:var(--shadow-sm)}\n.tabs-pill .tab[aria-selected='true']::after{display:none}\n.pagination{display:flex;align-items:center;gap:4px}\n.page-btn{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 8px;font-family:inherit;font-size:0.8125rem;font-weight:500;color:var(--text-muted);background:none;border:1px solid transparent;border-radius:var(--radius-pill);cursor:pointer;transition:all var(--transition-fast)}\n.page-btn:hover:not(:disabled){color:var(--text-body);background:var(--color-bg-tertiary)}\n.page-btn[aria-current='page']{color:#fff;background:var(--color-accent);border-color:var(--color-accent)}\n.page-btn:disabled{color:var(--color-border-strong);cursor:not-allowed}\n.page-gap{min-width:20px;text-align:center;color:var(--text-faint);font-size:0.8125rem}\n.pagination-meta{margin-right:12px;font-size:0.8125rem;color:var(--text-faint)}\n\n/* feedback */\n.alert{display:flex;align-items:flex-start;gap:13px;padding:15px 18px;border:1px solid var(--color-accent-glow);border-radius:var(--radius-md);background:var(--color-accent-light);font-size:0.875rem;line-height:1.6}\n.alert-icon{flex:none;margin-top:1px;color:var(--color-accent)}\n.alert-title{font-weight:600;letter-spacing:-0.01em;margin-bottom:3px}\n.alert-body{color:var(--text-muted)}\n.alert-success{background:var(--color-success-light);border-color:rgba(31,157,107,0.2)}\n.alert-success .alert-icon{color:var(--color-success)}\n.alert-warning{background:var(--color-warning-light);border-color:rgba(192,122,18,0.2)}\n.alert-warning .alert-icon{color:var(--color-warning)}\n.alert-danger{background:var(--color-danger-light);border-color:rgba(209,67,91,0.2)}\n.alert-danger .alert-icon{color:var(--color-danger)}\n.alert-close{margin-left:auto;display:flex;padding:0;color:var(--text-faint);background:none;border:none;cursor:pointer}\n.alert-close:hover{color:var(--text-body)}\n.toast{display:flex;align-items:center;gap:12px;min-width:300px;max-width:420px;padding:13px 16px;background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);font-size:0.875rem;color:var(--text-body)}\n.toast-icon{flex:none;display:flex;color:var(--color-accent)}\n.toast-success .toast-icon{color:var(--color-success)}\n.toast-danger .toast-icon{color:var(--color-danger)}\n.toast-action{margin-left:auto;padding:0;font-family:inherit;font-size:0.8125rem;font-weight:500;color:var(--color-accent);background:none;border:none;cursor:pointer;transition:opacity var(--transition-fast)}\n.toast-action:hover{opacity:0.7}\n.toast-stack{position:fixed;right:24px;bottom:24px;z-index:300;display:flex;flex-direction:column;gap:10px}\n.tooltip-wrap{position:relative;display:inline-flex}\n.tooltip{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);z-index:150;padding:6px 10px;font-size:0.75rem;font-weight:500;line-height:1.4;white-space:nowrap;color:#fff;background:var(--color-text-primary);border-radius:var(--radius-sm);box-shadow:var(--shadow-md);opacity:0;pointer-events:none;transition:opacity var(--transition-fast)}\n.tooltip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:4px solid transparent;border-top-color:var(--color-text-primary)}\n.tooltip-bottom{top:calc(100% + 8px);bottom:auto}\n.tooltip-bottom::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:var(--color-text-primary)}\n.tooltip-wrap:hover .tooltip,.tooltip-wrap:focus-within .tooltip{opacity:1}\n.dialog-overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--color-scrim);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}\n.dialog{width:100%;max-width:460px;background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-xl);padding:28px}\n.dialog-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:10px}\n.dialog-title{font-size:1.125rem;font-weight:600;letter-spacing:-0.01em}\n.dialog-close{margin-left:auto;display:flex;padding:0;color:var(--text-faint);background:none;border:none;cursor:pointer;transition:color var(--transition-fast)}\n.dialog-close:hover{color:var(--text-body)}\n.dialog-body{font-size:0.875rem;color:var(--text-muted);line-height:1.6}\n.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}\n<\u002Fstyle>\n  <script src=\"71b83fe5-f11b-4854-ac21-5cd9677d42b5\"><\u002Fscript>\n  <style>body{margin:0;background:#ececf3}a{color:var(--color-accent)}a:hover{color:var(--color-accent-hover)}<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"display:flex;flex-direction:column;gap:56px;padding:64px;font-family:var(--font-sans);color:var(--text-body);width:max-content\">\n  <header style=\"max-width:900px\">\n    <div style=\"font-size:13px;font-weight:600;color:var(--color-accent)\">macOS 14+ · 選單列 App · 高保真<\u002Fdiv>\n    <h1 style=\"margin:6px 0 8px;font-size:40px;font-weight:700;letter-spacing:-0.03em;line-height:1.1\">{{ appName }} — 完整 UI<\u002Fh1>\n    <p style=\"margin:0;font-size:15px;color:var(--text-muted);line-height:1.6\">每組畫面上排淺色、下排深色。所有畫面都是可操作的：側邊欄可切換、開關可按、角度儀可拖、音效可加入與移除。產品名稱由右側 Tweaks 的 appName 統一替換。<\u002Fp>\n  <\u002Fheader>\n\n  <section id=\"menubar\" data-screen-label=\"01 選單列\" style=\"display:flex;flex-direction:column;gap:16px\">\n    <h2 style=\"margin:0;font-size:22px;font-weight:700;letter-spacing:-0.02em\">1 · 選單列圖示與下拉選單<\u002Fh2>\n    <sc-for list=\"{{ themes }}\" as=\"t\" hint-placeholder-count=\"2\">\n      <div style=\"{{ t.style }}\">\n        <div style=\" ed)\">5 校準 · 中拍 · 成功<\u002Fspan><div style=\"width:560px;height:440px\"><dc-import name=\"Onboarding\" style=\"width:100%;height:100%\" app-name=\"{{ appName }}\" step=\"{{ 4 }}\" cal-step=\"{{ 1 }}\" cal-state=\"success\" hint-size=\"560px,440px\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font-size:12px;font-weight:600;color:var(--text-muted)\">5 校準 · 重拍 · 失敗（太輕）<\u002Fspan><div style=\"width:560px;height:440px\"><dc-import name=\"Onboarding\" style=\"width:100%;height:100%\" app-name=\"{{ appName }}\" step=\"{{ 4 }}\" cal-step=\"{{ 2 }}\" cal-state=\"fail\" hint-size=\"560px,440px\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font-size:12px;font-weight:600;color:var(--text-muted)\">5 校準 · 逾時<\u002Fspan><div style=\"width:560px;height:440px\"><dc-import name=\"Onboarding\" style=\"width:100%;height:100%\" app-name=\"{{ appName }}\" step=\"{{ 4 }}\" cal-step=\"{{ 0 }}\" cal-state=\"timeout\" hint-size=\"560px,440px\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font-size:12px;font-weight:600;color:var(--text-muted)\">5 校準 · 打字 5 秒 · 記錄中<\u002Fspan><div style=\"width:560px;height:440px\"><dc-import name=\"Onboarding\" style=\"width:100%;height:100%\" app-name=\"{{ appName }}\" step=\"{{ 4 }}\" cal-step=\"{{ 3 }}\" cal-state=\"detecting\" hint-size=\"560px,440px\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font-size:12px;font-weight:600;color:var(--text-muted)\">6 完成 · 指出選單列位置<\u002Fspan><div style=\"width:560px;height:440px\"><dc-import name=\"Onboarding\" style=\"width:100%;height:100%\" app-name=\"{{ appName }}\" step=\"{{ 5 }}\" hint-size=\"560px,440px\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fsection>\n\n  <section id=\"dialogs\" data-screen-label=\"08 對話框\" style=\"display:flex;flex-direction:column;gap:16px\">\n    <h2 style=\"margin:0;font-size:22px;font-weight:700;letter-spacing:-0.02em\">4 · 對話框<\u002Fh2>\n    <sc-for list=\"{{ themes }}\" as=\"t\" hint-placeholder-count=\"2\">\n      <div style=\"{{ t.style }}\">\n        <div style=\"display:flex;gap:36px;align-items:flex-start;padding:28px;border-radius:24px;background:var(--color-bg-secondary)\">\n          <div style=\"display:flex;flex-direction:column;gap:10px;width:440px\"><span style=\"font-size:12px;font-weight:600;color:var(--text-muted)\">匯入 .spankpack · 預覽<\u002Fspan><dc-import name=\"Dialogs\" app-name=\"{{ appName }}\" kind=\"pack\" hint-size=\"440px,480px\"><\u002Fdc-import><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px;width:440px\"><span style=\"font-size:12px;font-weight:600;color:var(--text-muted)\">匯入 · 驗證失敗<\u002Fspan><dc-import name=\"Dialogs\" app-name=\"{{ appName }}\" kind=\"invalid\" hint-size=\"440px,340px\"><\u002Fdc-import><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px;width:440px\"><span style=\"font-size:12px;font-weight:600;color:var(--text-muted)\">刪除確認<\u002Fspan><dc-import name=\"Dialogs\" app-name=\"{{ appName }}\" kind=\"delete\" hint-size=\"440px,220px\"><\u002Fdc-import><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px;width:440px\"><span style=\"font-size:12px;font-weight:600;color:var(--text-muted)\">新版本可用<\u002Fspan><dc-import name=\"Dialogs\" app-name=\"{{ appName }}\" kind=\"update\" hint-size=\"440px,320px\"><\u002Fdc-import><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fsection>\n\n  <section id=\"states\" data-screen-label=\"09 元件狀態\" style=\"display:flex;flex-direction:column;gap:16px\">\n    <h2 style=\"margin:0;font-size:22px;font-weight:700;letter-spacing:-0.02em\">5 · 關鍵元件狀態<\u002Fh2>\n    <div style=\"display:flex;gap:36px\">\n      <sc-for list=\"{{ themes }}\" as=\"t\" hint-placeholder-count=\"2\">\n        <div style=\"{{ t.style }}\">\n          <div style=\"width:960px;padding:28px;border-radius:24px;background:var(--color-bg-secondary)\"><dc-import name=\"Component States\" hint-size=\"904px,700px\"><\u002Fdc-import><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"notes\" data-screen-label=\"10 互動說明\" style=\"display:flex;flex-direction:column;gap:16px;max-width:1240px\">\n    <h2 style=\"margin:0;font-size:22px;font-weight:700;letter-spacing:-0.02em\">6 · 互動說明<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px\">\n      <div style=\"padding:24px;border-radius:16px;background:var(--color-bg);border:1px solid var(--color-border)\">\n        <h3 style=\"margin:0 0 10px;font-size:15px;font-weight:600\">拖曳<\u002Fh3>\n        <ul style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:13px;line-height:1.6;color:var(--text-muted)\">\n          <li>音效庫的任一列、「加入音效」選單裡的項目，都可以拖到 Profiles 的事件列上。拖入中的列整列以主色描邊；放開即加入，重複的音效會被忽略。<\u002Fli>\n          <li>已掛上的 chip 可以拖到另一個事件（複製，不移動）。內建 Profile 不接受拖放。<\u002Fli>\n          <li>角度儀的三個門檻圓點可直接拖曳；聚焦後用方向鍵每次 1°，按住 Shift 每次 5°，旁邊的滑桿同步。<\u002Fli>\n          <li>Finder 檔案拖進音效庫拖放區時顯示「放開就收下 N 個檔案」；不支援的格式在拖入時即轉為錯誤樣式。<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"padding:24px;border-radius:16px;background:var(--color-bg);border:1px solid var(--color-border)\">\n        <h3 style=\"margin:0 0 10px;font-size:15px;font-weight:600\">即時更新與動態效果<\u002Fh3>\n        <ul style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:13px;line-height:1.6;color:var(--text-muted)\">\n          <li>即時元素：角度數字與上蓋（約 30 次/秒）、拍打波形、自動靜音狀態列、選單第一行狀態、匯入進度、校準步驟。<\u002Fli>\n          <li>VoiceOver：連續變動的數值不主動朗讀；狀態改變（開始靜音與原因、校準成功/失敗、匯入完成）以禮貌模式朗讀一次。<\u002Fli>\n          <li>「減少動態效果」開啟時：波形每 0.5 秒更新一次、選單列圖示被打時改為淡出淡入一次而不抖動、展開與切頁不做位移動畫。<\u002Fli>\n          <li>觸發回饋（選用）：每次播放音效時選單列圖示抖動 0.45 秒；連擊時不重複疊加。<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"padding:24px;border-radius:16px;background:var(--color-bg);border:1px solid var(--color-border)\">\n        <h3 style=\"margin:0 0 10px;font-size:15px;font-weight:600\">視窗、鍵盤與命名<\u002Fh3>\n        <ul style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:13px;line-height:1.6;color:var(--text-muted)\">\n          <li>設定視窗打開時才出現在 Dock；關閉（⌘W 或紅色按鈕）後縮回選單列，Dock 圖示消失。從選單「設定…」或 ⌘, 重新打開，回到上次的頁面。<\u002Fli>\n          <li>Onboarding 完成或中途關閉都一樣縮回選單列；中途關閉時，下次打開設定會在感測器頁提示尚未校準。<\u002Fli>\n          <li>預設 760 × 520，最小 640 × 440；放大時事件列 chips 區域延展，清單欄寬固定。英文字串較長時標籤換行，不截斷。<\u002Fli>\n          <li>鍵盤：Tab 依序巡覽，⌘1–⌘5 切換側邊欄頁面；選單列選單用 ↑↓ 移動、← 開子選單（選單靠右，子選單向左展開）、Esc 關閉。<\u002Fli>\n          <li>產品名稱集中在一個參數，所有畫面、選單項目（「暫停 {{ appName }}」「結束 {{ appName }}」）與權限說明同步替換。<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;appName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Spank&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;themes&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;both&quot;,&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;both&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const dark = {\n      '--color-bg': '#1d1d2b', '--color-bg-secondary': '#242436', '--color-bg-tertiary': '#2f2f46',\n      '--color-text-primary': '#ececf6', '--color-text-secondary': '#a8a8c6', '--color-text-tertiary': '#80809f',\n      '--color-border': 'rgba(255,255,255,0.08)', '--color-border-strong': 'rgba(255,255,255,0.15)',\n      '--color-accent': '#7472f5', '--color-accent-hover': '#8a88ff', '--color-accent-light': 'rgba(116,114,245,0.16)', '--color-accent-glow': 'rgba(116,114,245,0.32)',\n      '--color-success': '#3cc08b', '--color-success-light': 'rgba(60,192,139,0.14)', '--color-warning': '#e0a040', '--color-warning-light': 'rgba(224,160,64,0.14)',\n      '--color-danger': '#f06a80', '--color-danger-light': 'rgba(240,106,128,0.14)', '--color-scrim': 'rgba(0,0,0,0.45)',\n      '--surface-page': '#1d1d2b', '--surface-section': '#242436', '--surface-card': '#1d1d2b', '--surface-sunken': '#15151f',\n      '--text-body': '#ececf6', '--text-muted': '#a8a8c6', '--text-faint': '#80809f',\n      '--shadow-sm': '0 1px 2px rgba(0,0,0,0.3)', '--shadow-md': '0 4px 12px rgba(0,0,0,0.35)', '--shadow-lg': '0 8px 32px rgba(0,0,0,0.45)', '--shadow-xl': '0 20px 60px rgba(0,0,0,0.55)',\n      colorScheme: 'dark', color: '#ececf6', borderRadius: '24px', background: '#15151f'\n    };\n    const mode = this.props.themes || 'both';\n    const list = [];\n    if (mode !== 'dark') list.push({ style: { colorScheme: 'light' } });\n    if (mode !== 'light') list.push({ style: dark });\n    return { appName: this.props.appName || 'Spank', themes: list };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
