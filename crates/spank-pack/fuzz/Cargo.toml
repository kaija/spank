[package]
name = "spank-pack-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
spank-pack = { path = ".." }

# Not part of the main workspace: cargo-fuzz needs nightly.
[workspace]

[[bin]]
name = "read_pack"
path = "fuzz_targets/read_pack.rs"
test = false
doc = false
bench = false
