[package]
name = "spank-pack"
description = ".spankpack sound pack reading, validation, import and export (ADR-0009)."
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
spank-core = { path = "../spank-core" }
spank-store = { path = "../spank-store" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
hound = "3.5"
sha2 = "0.11"
fastrand = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
