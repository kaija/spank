[package]
name = "spank-audio"
description = "Sound import (decode, resample, trim, loudness-normalize) and playback for spank (ADR-0008)."
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
symphonia = { version = "0.6", default-features = false, features = ["wav", "pcm", "mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "adpcm"] }
rubato = "5"
ebur128 = "0.1"
hound = "3.5"
sha2 = "0.11"
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
ebur128 = "0.1"

[lints]
workspace = true
