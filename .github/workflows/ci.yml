name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build & test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Frontend typecheck
        run: pnpm --dir apps/desktop typecheck
      - name: Frontend build (static export, embedded by Tauri)
        run: pnpm --dir apps/desktop build
      - name: Frontend tests
        run: pnpm --dir apps/desktop test

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      - name: Trace replay gate (slap precision / recall)
        env:
          SPANK_TRACE_REPORT: ${{ runner.temp }}/trace-report.md
        run: |
          cargo test -p spank-sensors --test slap_traces -- --nocapture
          cat "$SPANK_TRACE_REPORT" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace-report
          path: ${{ runner.temp }}/trace-report.md
          if-no-files-found: ignore
      - name: TypeScript bindings are up to date
        run: |
          cargo test -p spank-core --features ts export_bindings
          git diff --exit-code apps/desktop/src/bindings

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Coverage (≥ 80% lines)
        run: cargo llvm-cov -p spank-core -p spank-store -p spank-audio -p spank-pack -p spank-sensors -p spank-sysmon --summary-only --fail-under-lines 80

  ai-dlc:
    name: AI-DLC scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch policy and comment rendering tests
        run: python3 -I -m unittest discover -s .github/ai -v

  deny:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
