[package]
name = "spank-desktop"
description = "Spank menu bar app (Tauri v2 shell)"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[lib]
name = "spank_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
spank-core = { path = "../../../crates/spank-core" }
spank-store = { path = "../../../crates/spank-store" }
spank-audio = { path = "../../../crates/spank-audio" }
spank-pack = { path = "../../../crates/spank-pack" }
spank-sensors = { path = "../../../crates/spank-sensors" }
spank-sysmon = { path = "../../../crates/spank-sysmon" }
tauri-plugin-dialog = "=2.8.2"
libc = "0.2"
core-foundation = { workspace = true }
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
serde.workspace = true
serde_json.workspace = true
tauri-plugin-updater = { version = "2.14.0", optional = true }
smappservice-rs = { version = "0.1.3", optional = true }

# Build flavours (ADR-0017): the DMG ("Spank") is the default; the Mac App Store edition
# ("Creaky") is `--no-default-features --features appstore`.
[features]
default = ["updater"]
updater = ["dep:tauri-plugin-updater"]
appstore = ["dep:smappservice-rs"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
