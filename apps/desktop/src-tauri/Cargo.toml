[package]
name = "spank-desktop"
description = "Spank menu bar app (Tauri v2 shell)"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[lib]
name = "spank_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
spank-core = { path = "../../../crates/spank-core" }
spank-store = { path = "../../../crates/spank-store" }
spank-audio = { path = "../../../crates/spank-audio" }
spank-pack = { path = "../../../crates/spank-pack" }
spank-sensors = { path = "../../../crates/spank-sensors" }
spank-sysmon = { path = "../../../crates/spank-sysmon" }
tauri-plugin-dialog = "=2.8.2"
libc = "0.2"
core-foundation = { workspace = true }
tauri = { version = "2.12.5", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
